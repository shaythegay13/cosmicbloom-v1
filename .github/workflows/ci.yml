name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate art and verify determinism
        run: |
          npm run art
          git diff --exit-code -- client/public/atlases \
            || (echo '::error::Art output drifted — run `npm run art` and commit' && exit 1)

      - name: Unit + API tests
        run: npm test

      - name: Build web client
        run: npm run client:build
